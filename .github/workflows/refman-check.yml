name: refman-check

on:
  push:
  pull_request:

jobs:
  refman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate generated refman matches stdlib
        run: python3 tools/refman.py --check
